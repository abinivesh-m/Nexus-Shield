name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Show build output on failure
        if: failure()
        run: |
          echo "=== last 120 lines of the Gradle build ==="
          tail -n 120 /tmp/build.log || true
          echo "=== every APK on disk ==="
          find . -name "*.apk" -not -path "./.git/*" || true

      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist
          APK=$(find . -name "*.apk" -not -path "./.git/*" -not -path "./dist/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK was produced by the build"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "using $APK"
          cp "$APK" dist/nexusshield-release.apk
          ls -lh dist

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-release-apk
          path: dist/nexusshield-release.apk
          if-no-files-found: warn
          retention-days: 30
