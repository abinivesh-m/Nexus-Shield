name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable

      - name: Increase inotify limits (fix file watcher crash)
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      - name: Clean build cache
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          FLUTTER_NO_ANALYTICS: 'true'
          CI: 'true'
        run: |
          flutter build apk --release --target-platform android-arm64
          echo "=== APK files ==="
          find build -name "*.apk" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
