name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          APK=$(find . -name "app-release.apk" -not -path "./dist/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no app-release.apk was produced"
            find . -name "*.apk" || true
            exit 1
          fi
          cp "$APK" dist/nexusshield-release.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusshield-release-apk
          path: dist/nexusshield-release.apk
          if-no-files-found: error
          retention-days: 30
